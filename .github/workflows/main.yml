name: "CI"

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Style-only lints (naming/const) are pre-existing; fail on errors and warnings.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-android:
    name: Build Android (debug)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Release artifacts are intentionally not published here: signing keys
      # (android/key.properties) and GEMINI_API_KEY are not available in CI.
      - run: flutter build apk --debug --dart-define=GEMINI_API_KEY=ci-placeholder
